name: Build news from microCMS

on:
  repository_dispatch:
    types: [microcms]
  workflow_dispatch:

concurrency:
  group: build-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild news pages
        env:
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python3 cms/build-news.py

      - name: Run the pipeline tests
        # After the build, before the commit: this gates what is about to be
        # published, not just the code that produced it. unittest rather than
        # pytest so the runner needs no install.
        run: python3 -m unittest discover -s cms/tests -t .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "CMS: rebuild news pages"
          git push
